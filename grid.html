    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./grid.css">
    <style>
        .page{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 20px;
            grid-row-gap:10px;
            grid-column-gap: 10px;
            width:20px;
            height:20px;
            
            padding: 10px;
            /* column-gap: 8px; */
        }
        .grid1{
            display: grid;
            grid-template-columns: 1fr 1fr ;
            gap: 5px;
            height: 300px;
            width: 300px;
            padding:10px;
            background-color: aquamarine;
        }
        #box1{
            grid-column: 1/4;
        }
        #box2{
            grid-column: 1/2;
        }
        #box3{
            grid-column: 2/4;
        }
        #box4{
            grid-column: 1/4;
        }

        .box{
            background-color: rgb(10, 88, 88);
            text-align: center;
            justify-content: center;
            font-weight: bold;
            
        }
        .grid2{
             display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            height: 300px;
            width: 300px;
            padding:10px;
            background-color: aquamarine;
        }
        #Box1{
            grid-column: 1/6;
        }
        #Box2{
            grid-column: 1/3;
        }
        #Box3{
            grid-column: 3/5;
        }
        #Box4{
            grid-column: 5/6;
        }
        #Box5{
            grid-column: 1/6;
        }
        #Box6{
            grid-column: 1/6;
        }

        .grid3{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
             height: 300px;
            width: 300px;
            padding:10px;
            background-color: aquamarine;
        }
        .grid4{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
             height: 300px;
            width: 300px;
            padding:10px;
            background-color: aquamarine;
        }
#y{
    grid-column: 1/5;
}
#z{
    grid-column: 1/5;
}
.grid5{
    display: grid;
            grid-template-columns: 1fr 1fr ;
            gap: 5px;
             height: 300px;
            width: 300px;
            padding:10px;
            background-color: aquamarine;
    
}
#A{
    grid-column: 1/6;
}
#B{
    grid-column: 1/2;
}
#C{
    grid-column: 2/6;
}
#E{
    grid-column: 1/6;
}
#F{
    grid-column: 1/2;
}

#G{
    grid-column: 2/6;
}


        
    </style>
</head>
<body>
    <div class="page">
        <div class="grid1">
            <div class="box" id="box1">A</div>
            <div class="box" id="box2">A</div>
            <div class="box" id="box3">A</div>
            <div class="box" id="box4">A</div>
        </div>
        <div class="grid2">
            <div class="box" id="Box1">1</div>
            <div class="box" id="Box2">2</div>
            <div class="box" id="Box3">3</div>
            <div class="box" id="Box4">4</div>
            <div class="box" id="Box5">5</div>
            <div class="box" id="Box6">6</div>

        </div>
        <div class="grid3">

            <div class="box" id="a">a</div>
            <div class="box" id="b">b</div>
            <div class="box" id="c">c</div>
            <div class="box" id="d">d</div>
            <div class="box" id="e">e</div>
            <div class="box" id="f">f</div>
            <div class="box" id="g">g</div>
            <div class="box" id="h">h</div>

            <div class="box" id="j">j</div>
            <div class="box" id="k">k</div>
            <div class="box" id="l">l</div>
        </div>
        <div class="grid4">
            <div class="box" id="m">m</div>
            <div class="box" id="n">n</div>
            <div class="box" id="o">o</div>

            <div class="box" id="u">u</div>

            <div class="box" id="x">x</div>

        <div class="grid5">
             <div class="box" id="A">A</div>

        </div>
    </div>
</body>
